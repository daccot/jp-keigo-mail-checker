<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本式メール敬語チェッカー 設定</title>
    <link rel="stylesheet" href="styles/common.css">
  </head>
  <body class="options-body">
    <main class="app-shell options-shell">
      <header class="app-header">
        <div>
          <h1>設定</h1>
          <p>解析トーン、警告感度、履歴保存を設定します。</p>
        </div>
      </header>

      <section class="card">
        <label class="field-label" for="base-tone">基準トーン</label>
        <select id="base-tone" class="input-field">
          <option value="external">社外向け</option>
          <option value="internal">社内向け</option>
          <option value="job_hunting">就職活動向け</option>
        </select>

        <label class="field-label" for="warning-sensitivity">警告感度</label>
        <select id="warning-sensitivity" class="input-field">
          <option value="low">低</option>
          <option value="standard">標準</option>
          <option value="high">高</option>
        </select>

        <label class="field-label" for="suggestion-limit">候補表示数</label>
        <input id="suggestion-limit" type="number" min="1" max="20" class="input-field">

        <label class="checkbox-line">
          <input id="history-enabled" type="checkbox">
          履歴を保存する
        </label>

        <div class="toolbar">
          <button id="save-settings-button" type="button">保存</button>
          <button id="reset-settings-button" type="button" class="secondary-button">初期値に戻す</button>
        </div>
        <p id="settings-status" class="status-text"></p>
      </section>
    </main>
    <script src="options.js"></script>
  </body>
</html>
