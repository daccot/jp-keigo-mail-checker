<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本式メール敬語チェッカー</title>
    <link rel="stylesheet" href="styles/common.css">
  </head>
  <body class="popup-body">
    <main class="app-shell popup-shell">
      <header class="app-header">
        <div>
          <h1>日本式メール敬語チェッカー</h1>
          <p>敬語の偏り、警告、候補をローカル解析します。</p>
        </div>
      </header>

      <section class="card">
        <div class="toolbar">
          <button id="import-selection-button" type="button" class="secondary-button">選択内容を取り込む</button>
          <button id="open-sidepanel-button" type="button" class="secondary-button">詳細表示</button>
        </div>
        <textarea id="input-text" class="editor editor-compact" placeholder="メール文面を貼り付けてください。"></textarea>
        <div class="toolbar">
          <button id="check-button" type="button">チェック</button>
          <a href="options.html" target="_blank" class="text-link">設定</a>
        </div>
      </section>

      <section class="card">
        <h2>サマリ</h2>
        <div id="score-summary" class="summary-grid"></div>
      </section>

      <section class="card">
        <h2>警告</h2>
        <ul id="warning-list" class="list-block"></ul>
      </section>

      <section class="card">
        <h2>定型句候補</h2>
        <div id="template-list" class="suggestion-stack"></div>
      </section>

      <section class="card">
        <h2>言い換え候補</h2>
        <div id="rewrite-list" class="suggestion-stack"></div>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
